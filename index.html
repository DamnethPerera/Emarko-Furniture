<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Marko Modern Furniture</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fbf7f5',
                            100: '#f6eee9',
                            500: '#d97706',
                            600: '#b45309',
                            900: '#451a03',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-stone-50 text-stone-800 font-sans antialiased">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-stone-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-brand-600 text-white p-2 rounded-xl">
                    <i class="fa-solid fa-couch text-lg"></i>
                </div>
                <span class="text-xl font-bold tracking-tight text-stone-900">E-Marko</span>
            </div>

            <div class="flex items-center gap-4">
                <button onclick="toggleCart()" class="relative p-2 text-stone-600 hover:text-stone-900 transition">
                    <i class="fa-solid fa-bag-shopping text-xl"></i>
                    <span id="cartCount" class="absolute -top-1 -right-1 bg-brand-600 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Controls & Filters Section -->
        <section class="mb-8 space-y-4">
            <div class="flex flex-col md:flex-row gap-4 justify-between items-start md:items-center">
                <!-- Search Bar -->
                <div class="relative w-full md:w-80">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-stone-400"></i>
                    <input type="text" id="searchInput" oninput="handleAdvancedFilters()" placeholder="Search furniture..." class="w-full pl-10 pr-4 py-2 bg-white border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition">
                </div>

                <!-- Category Pills -->
                <div class="flex flex-wrap gap-2 bg-stone-200/60 p-1 rounded-2xl w-full md:w-auto">
                    <button onclick="filterProducts('all')" class="filter-btn px-3 py-2 rounded-xl text-xs sm:text-sm font-medium bg-white text-stone-900 shadow-sm transition">All</button>
                    <button onclick="filterProducts('Living Room')" class="filter-btn px-3 py-2 rounded-xl text-xs sm:text-sm font-medium text-stone-600 hover:text-stone-900 transition">Living</button>
                    <button onclick="filterProducts('Bedroom')" class="filter-btn px-3 py-2 rounded-xl text-xs sm:text-sm font-medium text-stone-600 hover:text-stone-900 transition">Bedroom</button>
                    <button onclick="filterProducts('Dining')" class="filter-btn px-3 py-2 rounded-xl text-xs sm:text-sm font-medium text-stone-600 hover:text-stone-900 transition">Dining</button>
                    <button onclick="filterProducts('Office')" class="filter-btn px-3 py-2 rounded-xl text-xs sm:text-sm font-medium text-stone-600 hover:text-stone-900 transition">Office</button>
                </div>
            </div>

            <!-- Advanced Price Filter -->
            <div class="bg-white p-4 rounded-2xl border border-stone-200 flex flex-col md:flex-row gap-4 items-center justify-between">
                <div class="flex items-center gap-3 w-full md:w-1/2">
                    <label for="priceRangeSlider" class="text-xs sm:text-sm font-medium text-stone-600 whitespace-nowrap">Max Price:</label>
                    <input type="range" id="priceRangeSlider" min="5000" max="10000000" step="5000" value="10000000" oninput="syncPriceFromSlider(this.value)" class="w-full accent-brand-600 cursor-pointer">
                </div>
                
                <!-- Manual Price Input & Unlimited Indicator -->
                <div class="flex items-center gap-2 w-full md:w-auto justify-end">
                    <span class="text-xs text-stone-500 font-medium">LKR</span>
                    <input type="number" id="priceInputManual" min="0" max="99999999" placeholder="Unlimited" oninput="syncPriceFromInput(this.value)" class="w-36 px-3 py-1.5 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                    <span id="priceDisplayLabel" class="text-xs font-semibold text-brand-600 bg-brand-50 px-2.5 py-1 rounded-lg">Unlimited</span>
                </div>
            </div>
        </section>

        <!-- Product Grid -->
        <section>
            <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Dynamic Products Rendered via JS -->
            </div>
            <div id="noResults" class="hidden text-center py-12">
                <i class="fa-solid fa-couch text-4xl text-stone-300 mb-3"></i>
                <p class="text-stone-500">No furniture items match your search parameters.</p>
            </div>
        </section>
    </main>

    <!-- Shopping Cart Drawer -->
    <div id="cartDrawer" class="fixed inset-0 z-50 pointer-events-none transition-opacity duration-300 opacity-0">
        <div onclick="toggleCart()" class="absolute inset-0 bg-stone-900/40 backdrop-blur-sm"></div>
        <div class="absolute right-0 top-0 h-full w-full max-w-md bg-white shadow-2xl pointer-events-auto flex flex-col justify-between p-6">
            <div>
                <div class="flex justify-between items-center border-b border-stone-100 pb-4 mb-4">
                    <h2 class="text-lg font-bold text-stone-900">Your Cart</h2>
                    <button onclick="toggleCart()" class="text-stone-400 hover:text-stone-600">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>
                <div id="cartItemsList" class="space-y-4 max-h-[60vh] overflow-y-auto">
                    <!-- Cart items rendered here -->
                </div>
            </div>
            <div class="border-t border-stone-100 pt-4">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-stone-600 font-medium">Total:</span>
                    <span id="cartTotal" class="text-xl font-bold text-stone-900">LKR 0</span>
                </div>
                <button class="w-full bg-brand-600 text-white font-medium py-3 rounded-xl hover:bg-brand-500 transition">Proceed to Checkout</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        const products = [
            { id: 1, name: "Minimalist Fabric Sofa", category: "Living Room", price: 125000, image: "https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=500&q=80" },
            { id: 2, name: "Nordic Wooden Dining Table", category: "Dining", price: 85000, image: "https://images.unsplash.com/photo-1617806118233-18e1de247200?w=500&q=80" },
            { id: 3, name: "Ergonomic Mesh Office Chair", category: "Office", price: 45000, image: "https://images.unsplash.com/photo-1580481072645-022f9a6d1270?w=500&q=80" },
            { id: 4, name: "King Size Oak Bed Frame", category: "Bedroom", price: 210000, image: "https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=500&q=80" },
            { id: 5, name: "Modern Leather Lounge Chair", category: "Living Room", price: 95000, image: "https://images.unsplash.com/photo-1567538096630-e0c55bd6374c?w=500&q=80" },
            { id: 6, name: "Compact Writing Desk", category: "Office", price: 38000, image: "https://images.unsplash.com/photo-1518455027359-f3f8164ba6bd?w=500&q=80" }
        ];

        let cart = [];
        let currentFilterCategory = 'all';

        // Initialize App
        document.addEventListener("DOMContentLoaded", () => {
            renderProducts(products);
        });

        // Render Product Cards
        function renderProducts(items) {
            const grid = document.getElementById('productGrid');
            const noResults = document.getElementById('noResults');
            
            if (items.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');
            grid.innerHTML = items.map(product => `
                <div class="bg-white rounded-2xl border border-stone-200 overflow-hidden hover:shadow-lg transition group">
                    <div class="h-48 overflow-hidden bg-stone-100">
                        <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                    </div>
                    <div class="p-5 flex flex-col justify-between">
                        <div>
                            <span class="text-xs font-semibold text-brand-600 uppercase tracking-wider">${product.category}</span>
                            <h3 class="text-lg font-bold text-stone-900 mt-1">${product.name}</h3>
                        </div>
                        <div class="mt-4 flex items-center justify-between">
                            <span class="text-lg font-bold text-stone-900">LKR ${product.price.toLocaleString()}</span>
                            <button onclick="addToCart(${product.id})" class="bg-stone-900 text-white p-2.5 rounded-xl hover:bg-brand-600 transition">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Category Filter with fixed matching logic for "Living"
        function filterProducts(category) {
            currentFilterCategory = category;
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                const btnText = btn.textContent.trim().toLowerCase();
                const targetCategory = category.toLowerCase();

                // Match exact category OR handle shorthand labels (e.g. "living" matching "living room")
                const isMatch = (btnText === targetCategory) ||
                                (targetCategory === 'living room' && btnText === 'living') ||
                                (category === 'all' && btnText === 'all');

                if (isMatch) {
                    btn.classList.add('bg-white', 'text-stone-900', 'shadow-sm'); 
                    btn.classList.remove('text-stone-600');
                } else {
                    btn.classList.remove('bg-white', 'text-stone-900', 'shadow-sm'); 
                    btn.classList.add('text-stone-600');
                }
            });

            handleAdvancedFilters();
        }

        // Price Input Synchronization
        function syncPriceFromSlider(value) {
            const manualInput = document.getElementById('priceInputManual');
            if (parseInt(value) >= 10000000) {
                manualInput.value = '';
            } else {
                manualInput.value = value;
            }
            handleAdvancedFilters();
        }

        function syncPriceFromInput(value) {
            const slider = document.getElementById('priceRangeSlider');
            // Restrict input length to max 8 digits
            if (value.length > 8) {
                value = value.slice(0, 8);
                document.getElementById('priceInputManual').value = value;
            }

            const numValue = parseInt(value);
            if (!isNaN(numValue) && numValue <= 10000000) {
                slider.value = numValue;
            } else if (value === '') {
                slider.value = 10000000;
            }
            handleAdvancedFilters();
        }

        // Filter Logic Function
        function handleAdvancedFilters() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const manualVal = document.getElementById('priceInputManual').value;
            const sliderVal = document.getElementById('priceRangeSlider').value;
            const displayLabel = document.getElementById('priceDisplayLabel');

            let maxPrice = Infinity;

            if (manualVal !== '' && !isNaN(parseInt(manualVal))) {
                maxPrice = parseInt(manualVal);
                displayLabel.textContent = `≤ LKR ${maxPrice.toLocaleString()}`;
            } else if (parseInt(sliderVal) < 10000000) {
                maxPrice = parseInt(sliderVal);
                displayLabel.textContent = `≤ LKR ${maxPrice.toLocaleString()}`;
            } else {
                displayLabel.textContent = 'Unlimited';
            }

            const filtered = products.filter(product => {
                const matchesCategory = currentFilterCategory === 'all' || product.category.toLowerCase() === currentFilterCategory.toLowerCase();
                const matchesSearch = product.name.toLowerCase().includes(searchQuery);
                const matchesPrice = product.price <= maxPrice;

                return matchesCategory && matchesSearch && matchesPrice;
            });

            renderProducts(filtered);
        }

        // Cart Actions
        function addToCart(productId) {
            const item = products.find(p => p.id === productId);
            cart.push(item);
            updateCartUI();
        }

        function toggleCart() {
            const drawer = document.getElementById('cartDrawer');
            drawer.classList.toggle('opacity-0');
            drawer.classList.toggle('pointer-events-none');
        }

        function updateCartUI() {
            document.getElementById('cartCount').textContent = cart.length;
            const list = document.getElementById('cartItemsList');
            
            list.innerHTML = cart.map((item, index) => `
                <div class="flex items-center justify-between border-b border-stone-100 pb-3">
                    <div class="flex items-center gap-3">
                        <img src="${item.image}" class="w-12 h-12 rounded-lg object-cover">
                        <div>
                            <h4 class="text-sm font-semibold text-stone-900">${item.name}</h4>
                            <span class="text-xs text-stone-500">LKR ${item.price.toLocaleString()}</span>
                        </div>
                    </div>
                    <button onclick="removeFromCart(${index})" class="text-stone-400 hover:text-red-500 text-sm">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cartTotal').textContent = `LKR ${total.toLocaleString()}`;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }
    </script>
</body>
</html>
